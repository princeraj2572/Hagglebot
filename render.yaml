# Deploy to Render (free web service): New > Blueprint, pick this repo.
# SQLite lives on the instance disk, which is ephemeral: data resets on each deploy and when a free instance
# spins down after inactivity. Fine for a simulation: add a want and it is rebuilt in seconds.
services:
  - type: web
    name: hagglebot
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # PayPal SANDBOX app credentials. Without them payments fall back to a labelled mock.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BUYER_EMAIL
        sync: false
      # Language model that phrases the messages. Without a key, templates are used.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Optional: real product listings in the marketplace.
      - key: CHANNEL3_API_KEY
        sync: false
